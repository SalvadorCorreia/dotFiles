# BACKGROUND
background {
    monitor = 
    path = ~/.config/hypr/Wallpapers/wallpaper5.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# GREETINGS
label {
    monitor =
    text = <b>Welcome!</b>
    color = rgba(216, 222, 233, .75)
    font_size = 72
    font_family = SF Pro Display Bold
    position = -480, 320
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%I:%M")</b>"
    color = rgba(216, 222, 233, .75)
    font_size = 52
    font_family = SF Pro Display Bold
    position = -480, 210
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "<b>$(date +"%A, %B %d")</b>"
    color = rgba(216, 222, 233, .75)
    font_size = 24
    font_family = SF Pro Display Bold
    position = -480, 130
    halign = center
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/hypr/vivek.png
    border_size = 2
    border_color = rgba(255, 255, 255, .75)
    size = 95
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = -480, 25
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 380, 65
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = -480, -90
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = <b>    $USER</b>
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 20
    font_family = SF Pro Display Bold
    position = -480, -90
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 380, 65
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><b><span foreground="##ffffff99">🔒  Enter Pass</span></b></i>
    hide_input = false
    position = -480, -185
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh)" 
    color = rgba(255, 255, 255, 0.65)
    font_size = 14
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = -480, 45
    halign = center
    valign = bottom
}

